<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc">
<title id="title">Energy Forecasting Lab architecture</title><desc id="desc">Public or synthetic data are causally cleaned, transformed to past-only features, split in chronological order, used to compare six models and lock selection on validation, evaluated on untouched test, refit for future forecasting and served through a dashboard and transparent virtual scenario.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#86a89a" stroke-width="1.4"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.box{fill:#fff;stroke:#dce7e0;stroke-width:1.3}.step{font-size:11px;fill:#11846c;letter-spacing:1.6px;font-weight:700}.head{font-size:20px;fill:#19372c;font-weight:700}.body{font-size:13px;fill:#718579}.arrow{fill:none;stroke:#86a89a;stroke-width:1.5;marker-end:url(#arrow)}.label{font-size:11px;fill:#92a397}</style></defs>
<rect width="1240" height="900" fill="#f3f7f4"/>
<rect width="1240" height="126" fill="#152e35"/>
<path d="M58 37h14v27H58zM73 48h14v35H73zM88 29h12v42H88z" fill="#8fd6b8"/>
<text x="123" y="56" font-size="27" fill="#fff" font-weight="700">AI-Powered Energy Consumption Forecasting</text>
<text x="124" y="84" font-size="13" fill="#8eafa2" letter-spacing=".6">DATASETS → LEAKAGE-SAFE EVIDENCE → VIRTUAL DECISIONS</text>
<rect x="1017" y="46" width="161" height="29" rx="6" fill="#264942" stroke="#41665a"/>
<text x="1098" y="65" text-anchor="middle" font-size="10" fill="#addcc6" letter-spacing="1">CPU / NO LIVE GRID</text>

<rect class="box" x="55" y="176" width="330" height="150" rx="14"/>
<text class="step" x="78" y="203">01 / INPUT SOURCES</text>
<text class="head" x="78" y="235">Measured or simulated</text>
<text class="body" x="78" y="260">UCI household minute → hourly power</text>
<text class="body" x="78" y="282">Seeded virtual building / permitted CSV</text>
<text class="body" x="78" y="304">Source license + coverage + SHA256</text>

<rect class="box" x="432" y="176" width="358" height="150" rx="14"/>
<text class="step" x="455" y="203">02 / CAUSAL PREPROCESSING</text>
<text class="head" x="455" y="235">Clean without peeking</text>
<text class="body" x="455" y="260">Sorted hourly mean kW / short past-only fill</text>
<text class="body" x="455" y="282">Long gaps remain missing; audit saved</text>
<text class="body" x="455" y="304">Imputed targets are not evaluation truth</text>

<rect class="box" x="837" y="176" width="348" height="150" rx="14"/>
<text class="step" x="860" y="203">03 / KNOWN AT ISSUANCE</text>
<text class="head" x="860" y="235">15 forecasting features</text>
<text class="body" x="860" y="260">Cyclic calendar + lags 1/2/24/48/168</text>
<text class="body" x="860" y="282">Shifted rolling mean / standard deviation</text>
<text class="body" x="860" y="304">Same definitions in training and serving</text>
<path class="arrow" d="M385 251h43"/><path class="arrow" d="M790 251h43"/>
<path class="arrow" d="M1011 326v28H220v36"/>
<text class="label" x="547" y="347">time-ordered eligible observations</text>

<rect class="box" x="55" y="394" width="330" height="165" rx="14"/>
<text class="step" x="78" y="421">04 / CHRONOLOGICAL SPLITS</text>
<text class="head" x="78" y="453">Time moves forward</text>
<rect x="78" y="472" width="177" height="20" rx="3" fill="#19977c"/><rect x="258" y="472" width="48" height="20" rx="3" fill="#7198c0"/><rect x="309" y="472" width="48" height="20" rx="3" fill="#c49a58"/>
<text x="167" y="486" text-anchor="middle" font-size="10" fill="#fff">TRAIN 70%</text><text x="282" y="486" text-anchor="middle" font-size="9" fill="#fff">15%</text><text x="333" y="486" text-anchor="middle" font-size="9" fill="#fff">15%</text>
<text class="body" x="78" y="518">Validation selects; test reports</text>
<text class="body" x="78" y="540">Scalers fit only on permitted training data</text>

<rect class="box" x="432" y="394" width="358" height="165" rx="14"/>
<text class="step" x="455" y="421">05 / BASELINES BEFORE COMPLEXITY</text>
<text class="head" x="455" y="453">Compare six candidates</text>
<text class="body" x="455" y="480">Persistence / yesterday / last week</text>
<text class="body" x="455" y="502">Ridge / random forest / scaled MLP</text>
<text class="body" x="455" y="524">24-hour recursive validation backtests</text>
<text class="body" x="455" y="546">Lock lowest validation RMSE champion</text>

<rect class="box" x="837" y="394" width="348" height="165" rx="14"/>
<text class="step" x="860" y="421">06 / UNTOUCHED TEST EVIDENCE</text>
<text class="head" x="860" y="453">Measure the right task</text>
<text class="body" x="860" y="480">Train+validation refit → held-out test</text>
<text class="body" x="860" y="502">One-step replay ≠ fixed-origin day-ahead</text>
<text class="body" x="860" y="524">MAE / RMSE / R² / horizon diagnostics</text>
<text class="body" x="860" y="546">14 sampled daily origins / no test selection</text>
<path class="arrow" d="M385 477h43"/><path class="arrow" d="M790 477h43"/>
<path class="arrow" d="M1011 559v34H220v42"/>
<text class="label" x="474" y="586">after test reporting only: final all-history refit for future use</text>

<rect class="box" x="55" y="639" width="330" height="157" rx="14"/>
<text class="step" x="78" y="666">07 / REUSABLE FORECAST BUNDLE</text>
<text class="head" x="78" y="698">Predict after cutoff</text>
<text class="body" x="78" y="724">Estimator + last 168 h + provenance</text>
<text class="body" x="78" y="746">Recursive future CSV / JSON / plots</text>
<text class="body" x="78" y="768">Empirical band: first 24 hours only</text>

<rect class="box" x="432" y="639" width="358" height="157" rx="14"/>
<text class="step" x="455" y="666">08 / VISIBLE AND VERIFIABLE</text>
<text class="head" x="455" y="698">Serve the evidence</text>
<text class="body" x="455" y="724">Validated Flask API + responsive SVG UI</text>
<text class="body" x="455" y="746">Offline interactive HTML snapshot</text>
<text class="body" x="455" y="768">Tests / manifests / logs / actual screenshots</text>

<rect x="837" y="639" width="348" height="157" rx="14" fill="#e8f4ed" stroke="#c9e2d3" stroke-width="1.3"/>
<text class="step" x="860" y="666">09 / VIRTUAL DECISION SANDBOX</text>
<text class="head" x="860" y="698">Shift flexible work</text>
<text class="body" x="860" y="724">Illustrative rates / energy conserved</text>
<text class="body" x="860" y="746">Original peak headroom respected</text>
<text class="body" x="860" y="768">Hypothetical savings; modeled CO₂ = same</text>
<path class="arrow" d="M385 718h43"/><path class="arrow" d="M790 718h43"/>

<line x1="55" y1="834" x2="1185" y2="834" stroke="#d8e4db"/>
<text x="55" y="860" font-size="11" fill="#739080">SOURCE OF TRUTH: modular code + actual saved predictions / data and model cards / reproducible checks</text>
<text x="55" y="883" font-size="11" fill="#8b9c90">Industry-oriented proof of work, not a production grid controller, real tariff quote or measured energy-saving intervention.</text>
</svg>
